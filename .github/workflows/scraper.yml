name: Scraper Corte Suprema

on:
  # Ejecución manual desde la UI de GitHub
  workflow_dispatch:
    inputs:
      target_year:
        description: "Año a scrapear (ej: 2025). Vacío = todos los años."
        required: false
        type: string
      max_pages:
        description: "Máximo de páginas a procesar. Vacío = sin límite."
        required: false
        type: string
      fast_mode:
        description: "Modo rápido (reduce esperas entre peticiones)."
        required: false
        type: boolean
        default: false

  # Ejecución automática cada 6 horas
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 6 horas máximo

    steps:
      # ── 1. Código ────────────────────────────────────────────────
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # ── 2. Python ────────────────────────────────────────────────
      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias Python
        run: pip install -r requirements.txt

      # ── 3. Playwright ────────────────────────────────────────────
      - name: Instalar Chromium (Playwright)
        run: playwright install chromium --with-deps

      # ── 4. Estado persistido entre ejecuciones ───────────────────
      # Usa actions/cache (no restore/save por separado) para que
      # el SQLite se guarde automáticamente aunque el job se cancele.
      - name: Restaurar base de datos SQLite (corridas previas)
        uses: actions/cache@v4
        with:
          path: state/manifest.sqlite
          key: scraper-db-${{ github.run_id }}
          restore-keys: scraper-db-

      # ── 5. Sesión ClaveÚnica ─────────────────────────────────────
      # SESSION_JSON debe contener el contenido de state/storage.json
      # codificado en base64. Ver scripts/export_session.sh.
      - name: Restaurar sesión ClaveÚnica desde secret
        env:
          SESSION_JSON: ${{ secrets.SESSION_JSON }}
        run: |
          mkdir -p state
          python3 -c "
          import base64, os
          data = base64.b64decode(os.environ['SESSION_JSON'])
          open('state/storage.json', 'wb').write(data)
          print(f'Sesión restaurada ({len(data)} bytes)')
          "

      # ── 6. Ejecutar scraper con auto-commit cada 5 minutos ───────
      - name: Ejecutar scraper
        timeout-minutes: 330
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Configurar git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Preparar rama data en un worktree separado
          git fetch origin data 2>/dev/null || true
          git worktree add /tmp/data data 2>/dev/null || \
            git worktree add /tmp/data -b data
          mkdir -p /tmp/data/sentencias

          # Función que copia archivos nuevos y hace commit
          push_new_files() {
            if [ ! -d out/sentencias ]; then return; fi
            cp -r out/sentencias/. /tmp/data/sentencias/
            cd /tmp/data
            git add sentencias/
            if ! git diff --staged --quiet; then
              COUNT=$(git diff --staged --name-only | wc -l)
              git commit -m "auto: $COUNT sentencia(s) ($(date -u '+%H:%M UTC')) run #${{ github.run_number }}"
              git push origin data 2>/dev/null || true
              echo "✅ $COUNT archivo(s) nuevos guardados en rama data."
            fi
            cd $GITHUB_WORKSPACE
          }

          # Proceso en segundo plano: commit cada 5 minutos
          (
            while true; do
              sleep 300
              push_new_files
            done
          ) &
          COMMITTER_PID=$!

          # Ejecutar scraper
          ARGS="--headful false --ci-mode --fast-mode true"
          [ -n "${{ inputs.target_year }}" ] && ARGS="$ARGS --target-year ${{ inputs.target_year }}"
          [ -n "${{ inputs.max_pages }}"  ] && ARGS="$ARGS --max-pages ${{ inputs.max_pages }}"
          echo "Ejecutando: python -m src.main $ARGS"
          python -m src.main $ARGS || true

          # Detener background committer
          kill $COMMITTER_PID 2>/dev/null || true

          # Commit final con todo lo que quede
          push_new_files

      # ── 8. Logs como artefacto ───────────────────────────────────
      - name: Subir logs de ejecución
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-${{ github.run_id }}
          path: logs/
          retention-days: 7
          if-no-files-found: warn
